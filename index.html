<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f11">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <title>Gym Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section class="view" data-view="today"></section>
    <section class="view" data-view="plan" hidden></section>
    <section class="view" data-view="progress" hidden></section>
    <section class="view" data-view="body" hidden></section>
    <section class="view" data-view="more" hidden></section>
  </div>

  <button id="resume" class="resume" hidden data-action="resume">
    <span class="resume-dot"></span>
    <span class="grow"><b id="resumeName">Workout</b> <span id="resumeTime" class="muted num"></span></span>
    <span class="resume-go">Resume</span>
  </button>

  <nav class="tabs" id="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Today</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Progress</button>
    <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 10a4 4 0 0 1 8 0M12 10l1.5-2"/></svg>Body</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>More</button>
  </nav>

  <div id="workout" class="workout" hidden></div>

  <div id="rest" class="rest" hidden>
    <div class="grow">
      <div class="row between"><span class="muted small b">Rest</span><span id="restTime" class="rest-time num">0:00</span></div>
      <div class="rest-track"><div id="restBar" class="rest-bar"></div></div>
    </div>
    <button class="btn-sm" data-action="rest-add">+30s</button>
    <button class="btn-sm" data-action="rest-skip">Skip</button>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
